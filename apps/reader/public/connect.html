<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>连接你的飞阅 · Fly View</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ee;color:#26392e;font-family:system-ui,"Microsoft Yahei",sans-serif;padding:32px 22px}main{max-width:480px;margin:6vh auto}.mark{font:italic bold 76px Georgia;color:#ce512c;line-height:1}small{letter-spacing:3px;font-size:10px}h1{font-size:34px;line-height:1.4;letter-spacing:-1px}p{color:#70776d;font-size:14px;line-height:1.85}section{background:#fffefb;border:1px solid #dfdfd3;border-radius:20px;padding:22px;margin-top:28px}button,a.action{width:100%;padding:16px 20px;min-height:52px;display:block;text-align:center;border:0;border-radius:12px;background:#293d30;color:#fff;font-size:15px;text-decoration:none;margin-top:12px;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#ede8dc!important;color:#293d30!important}textarea{width:100%;border:1px solid #d8dbcf;border-radius:10px;padding:12px;font-size:13px;min-height:80px}#status{min-height:25px;font-size:12px;white-space:pre-wrap}progress{width:100%;accent-color:#ce512c}.step{font-size:11px;color:#bd4e2c}details{margin-top:18px;font-size:12px;line-height:1.7}summary{cursor:pointer;min-height:32px}footer{margin-top:25px;font-size:11px;color:#8b8f82}
</style></head><body><main><div class="mark">f.</div><small>FLY VIEW / PERSONAL EDITION</small><h1>你的学习空间，<br>随身带走。</h1><p>第一次升级需要安装新版飞阅。之后，更新和新材料都可以直接在手机里接收。</p><section><div class="step">01 / 安装新版</div><button id="download">下载飞阅安装包</button><progress id="progress" value="0" max="100" hidden></progress><p id="status" role="status">正在检查连接…</p><div class="step">02 / 安装完成后</div><a class="action secondary" id="open" href="#">打开飞阅并连接个人空间</a><details><summary>打不开应用？复制配对码</summary><p>在飞阅「我的 → 个人空间」粘贴下面的配对码，再点连接。配对码只供本人使用。</p><textarea id="code" readonly aria-label="个人空间配对码"></textarea><button class="secondary" id="copy">复制配对码</button></details></section><footer>已有学习记录会保留。请直接覆盖安装，不要卸载旧版。</footer></main><script type="module">
const status=document.querySelector('#status'),download=document.querySelector('#download'),bar=document.querySelector('#progress');
let connection,encoded;
try{encoded=location.hash.slice(1);const decoded=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(encoded.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))));if(decoded.endpoint!=='https://fly-view-personal.vercel.app'||!/^\S{16,4096}$/.test(decoded.token))throw Error();connection=decoded;document.querySelector('#open').href='flyview://connect#'+encoded;document.querySelector('#code').value='flyview://connect#'+encoded;history.replaceState(null,'',location.pathname);status.textContent='个人连接已准备好。安装包仅向你的个人空间提供。';}catch{download.disabled=true;status.textContent='此链接缺少有效配对信息，请使用提供给你的专属二维码打开。';document.querySelector('#open').removeAttribute('href');}
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText('flyview://connect#'+encoded);status.textContent='配对码已复制。';}catch{status.textContent='请长按配对码，选择复制。';}};
download.onclick=async()=>{if(!connection)return;download.disabled=true;bar.hidden=false;status.textContent='正在下载，请保持此页面打开…';try{const manifest=await fetch('/api/release',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('版本信息暂不可用');return r.json();});const r=await fetch('/api/download',{headers:{Authorization:'Bearer '+connection.token},cache:'no-store'});if(!r.ok)throw Error(r.status===401?'配对已失效，请获取新的连接链接。':'暂时无法下载安装包，请重试。');const reader=r.body.getReader(),chunks=[];let size=0;for(;;){const {value,done}=await reader.read();if(done)break;chunks.push(value);size+=value.length;bar.value=manifest.size?size/manifest.size*100:0;status.textContent=`已下载 ${(size/1048576).toFixed(1)} MB`;}const blob=new Blob(chunks,{type:'application/vnd.android.package-archive'});const sha=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer())),b=>b.toString(16).padStart(2,'0')).join('');if(size!==manifest.size||sha!==manifest.sha256)throw Error('下载校验未通过，请重新下载。');const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Fly-View-0.9.0.apk';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);status.textContent='下载完整性校验通过。请在浏览器下载列表打开安装包；安装后回到此页面连接。';}catch(e){status.textContent=e.message||'下载未完成，请重试。';}finally{download.disabled=false;}};
</script></body></html>
